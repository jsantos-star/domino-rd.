    <style>
        :root {
            --azul-rd: #00bcd4; 
            --rojo-rd: #ff1744;

            --ficha-linea-v: #ffc107;
            --ficha-borde-par: #780000;

            --tapete-marca-agua: rgba(255, 255, 255, 0.06);

        .burbuja-estado.capicua { border-color: #FF0080; color: #FF0080; background: rgba(40,0,40,0.92); }

            gap: 4px;
        }

        #pos-j2 {
            right: 12px;
            top: 45%;
            transform: translateY(-50%);
            flex-direction: column;
            gap: 4px;
        }
        #pos-j2 .burbuja-estado { right: 110%; top: 50%; transform: translateY(-50%); }

        .fichas-ocultas { display: flex; gap: 2px; align-items: center; justify-content: center; }
        .fichas-ocultas.v { flex-direction: column; }

        .ficha-dorso { 
            border-radius: 3px; 
            border: 1px solid #1a2233; 
            box-shadow: 1px 1px 3px rgba(0,0,0,0.5); 
            position: relative; 
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: 
                linear-gradient(to right, transparent calc(50% - 1px), #ffffff calc(50% - 1px), #ffffff calc(50% + 1px), transparent calc(50% + 1px)),
                linear-gradient(to bottom, transparent calc(50% - 1px), #ffffff calc(50% - 1px), #ffffff calc(50% + 1px), transparent calc(50% + 1px)),
                conic-gradient(from 0deg at 50% 50%, #002868 0deg 90deg, #ce1126 90deg 180deg, #002868 180deg 270deg, #ce1126 270deg 360deg);
        }
        .ficha-dorso::after {

        }
        .ficha-dorso.h { width: 13px; height: 24px; } 
        .ficha-dorso.v { width: 24px; height: 13px; }

        /* BANDEJA INFERIOR ADAPTATIVA */
        .zona-nosotros-dock {
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;

        .mano-jugador-activa { 
            display: flex;

            align-items: flex-end;
            gap: 6px; 
            pointer-events: auto;
            background: rgba(7, 10, 16, 0.65);
            padding: 4px 8px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);

            transition: opacity 0.2s ease;
        }

        /* FICHAS */
        .ficha {
            width: 44px; 
            height: 82px; 
            background: var(--ficha-bg);
            border-radius: 7px; 
            display: flex; 
            flex-direction: column; 
            padding: 4px;
            box-shadow: 2px 3px 8px rgba(0,0,0,0.5); 
            cursor: pointer; 
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            border-top: 2.5px solid #002868; 
            border-bottom: 2.5px solid #ce1126;
            border-left: 1px solid var(--ficha-borde-par); 
            border-right: 1px solid var(--ficha-borde-par);
            flex-shrink: 0;
        }
        
        .ficha:hover { transform: translateY(-8px); }
        .ficha.seleccionada { transform: translateY(-14px); box-shadow: 0 0 16px rgba(0, 188, 212, 0.95); border-color: #00bcd4; }
        .ficha-mesa { position: absolute; pointer-events: none; }

        .ficha.horizontal { width: 82px !important; height: 44px !important; flex-direction: row; border-top: 1px solid var(--ficha-borde-par); border-bottom: 1px solid var(--ficha-borde-par); border-left: 2.5px solid #002868; border-right: 2.5px solid #ce1126; }
        .ficha.vertical { width: 44px !important; height: 82px !important; flex-direction: column; border-top: 2.5px solid #002868; border-bottom: 2.5px solid #ce1126; border-left: 1px solid var(--ficha-borde-par); border-right: 1px solid var(--ficha-borde-par); }

        .mitad { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 1.5px; padding: 2px; align-items: center; justify-items: center; }
        .linea-divisoria { background: var(--ficha-linea); height: 2px; width: 90%; margin: 0 auto; border-radius: 2px; }
        .ficha.horizontal .linea-divisoria { background: var(--ficha-linea-v); width: 2px; height: 90%; margin: auto 0; }
        .punto { width: 6.5px; height: 6.5px; background-color: var(--ficha-punto); border-radius: 50%; box-shadow: inset 1px 1px 2px rgba(255,255,255,0.3); }

        .blanco .punto { display: none; }
        .uno .punto:nth-child(1) { grid-area: 2 / 2; }
        .dos .punto:nth-child(1) { grid-area: 1 / 1; } .dos .punto:nth-child(2) { grid-area: 3 / 3; }
        .tres .punto:nth-child(1) { grid-area: 1 / 1; } .tres .punto:nth-child(2) { grid-area: 2 / 2; } .tres .punto:nth-child(3) { grid-area: 3 / 3; }
        .cuatro .punto:nth-child(1) { grid-area: 1 / 1; } .cuatro .punto:nth-child(2) { grid-area: 3 / 1; } .cuatro .punto:nth-child(3) { grid-area: 1 / 3; } .cuatro .punto:nth-child(4) { grid-area: 3 / 3; }
        .cinco .punto:nth-child(1) { grid-area: 1 / 1; } .cinco .punto:nth-child(2) { grid-area: 3 / 1; } .cinco .punto:nth-child(3) { grid-area: 2 / 2; } .cinco .punto:nth-child(4) { grid-area: 1 / 3; } .cinco .punto:nth-child(5) { grid-area: 3 / 3; }
        .seis .punto:nth-child(1) { grid-area: 1 / 1; } .seis .punto:nth-child(2) { grid-area: 2 / 1; } .seis .punto:nth-child(3) { grid-area: 3 / 1; } .seis .punto:nth-child(4) { grid-area: 1 / 3; } .seis .punto:nth-child(5) { grid-area: 2 / 3; } .seis .punto:nth-child(6) { grid-area: 3 / 3; }

        @keyframes latir { from { transform: translate(-50%, -50%) scale(1); } to { transform: translate(-50%, -50%) scale(1.15); } }

        #toast-mensaje {

    <script>
        let mazo = []; let jugadores = { 1: [], 2: [], 3: [], 4: [] }; 
        const clasesNumeros = ['blanco', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis'];

        let puntosNosotros = 0; let puntosEllos = 0; let metaPuntos = 200;
        let temaFichaActual = 'blanco'; let temaMesaActual = 'verde';
        let ultimoGanador = null; 
        let fichaCentro = null; let ramaIzquierda = []; let ramaDerecha = [];
        let extremoIzquierdo = null; let extremoDerecho = null;
        let turnoActual = 1; let juegoTerminado = false; let pasesConsecutivos = 0; 
        let salidaObligatoria = false; let ultimoJugadorEnJugar = null; 
        let esperandoSeleccionPunta = false; let fichaSeleccionada = null; let indexSeleccionado = null;
        let jugadorSalida = 1; 
        let esPrimerTurnoDespuesDeSalida = false;

        const nombresJugadores = { 1: "Nosotros", 2: "Rival 1", 3: "Compadre", 4: "Rival 2" };
        const frasesPensando = ["A ver...", "Pensando...", "Mmm...", "Esa pinta..."];
        const frasesPaso = ["¡Paso en banda!", "¡Pasó! ❌", "No llevo...", "Toque, jefe."];

        function generarHTMLMitad(numero) {
            let html = `<div class="mitad ${clasesNumeros[numero]}">`;
            for(let i = 0; i < numero; i++) html += `<div class="punto"></div>`;
            return html + `</div>`;
        }

        function sumarMano(mano) { return mano.reduce((sum, f) => sum + f[0] + f[1], 0); }

        function togglePantallaCompleta() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function toggleLibreta() {
            const panel = document.getElementById('panel-anotacion');
            panel.classList.toggle('abierta');
        }

        function toggleModalAjustes() {
            const modal = document.getElementById('modal-ajustes');
            modal.classList.toggle('oculto');
        }

        function cambiarMetaPuntos(nuevaMeta) {
            metaPuntos = nuevaMeta;
            document.getElementById('lbl-meta').innerText = `Meta: ${metaPuntos} pts`;
            
            [50, 100, 150, 200].forEach(pts => {
                const b = document.getElementById(`btn-meta-${pts}`);
                if (b) b.classList.toggle('activo', pts === nuevaMeta);
            });

            mostrarToast(`Meta: ${metaPuntos} puntos`);
            revisarPuntos();
        }

        function actualizarClasesBody() {
            document.body.className = `ficha-${temaFichaActual} mesa-${temaMesaActual}`;
        }

        function cambiarColorTemaFicha(tema) {
            temaFichaActual = tema;
            actualizarClasesBody();
            
            ['blanco', 'azul', 'rojo'].forEach(col => {
                const b = document.getElementById(`btn-color-${col}`);
                if (b) b.classList.toggle('activo', col === tema);
            });

            renderizarManos();
            renderizarMesa();
        }

        function cambiarColorMesa(tema) {
            temaMesaActual = tema;
            actualizarClasesBody();

            ['verde', 'negro', 'azul', 'blanco'].forEach(m => {
                const b = document.getElementById(`btn-mesa-${m}`);
                if (b) b.classList.toggle('activo', m === tema);
            });
        }

        function mostrarBurbuja(idJugador, mensaje, tipo, persistente = false, limpiar = true) {
            if(limpiar) limpiarBurbujas();
            const burbuja = document.getElementById(`burbuja-j${idJugador}`);
            if (burbuja) {
                burbuja.innerText = mensaje;
                burbuja.className = `burbuja-estado visible ${tipo}`;
                if(!persistente && (tipo === 'paso' || tipo === 'capicua' || tipo === 'ganador')) {
                    setTimeout(() => { burbuja.classList.remove('visible'); }, 2200);
                }
            }
        }

        function limpiarBurbujas() {
            for(let i=1; i<=4; i++) {
                const b = document.getElementById(`burbuja-j${i}`);
                if (b) b.className = 'burbuja-estado';
            }
        }

        function mostrarToast(mensaje) {
            const toast = document.getElementById('toast-mensaje');
            toast.innerText = mensaje; toast.classList.add('visible');
            setTimeout(() => { toast.classList.remove('visible'); }, 2400);
        }

        function ocultarToast() { document.getElementById('toast-mensaje').classList.remove('visible'); }

        function sacudirMesa() {
            const tapete = document.getElementById('mesa-tapete');
            tapete.classList.remove('mesa-temblando');
            void tapete.offsetWidth; 
            tapete.classList.add('mesa-temblando');
            setTimeout(() => tapete.classList.remove('mesa-temblando'), 500);
        }

        function dibujarFichasReveladas(idContenedor, mano, tipo) {
            const cont = document.getElementById(idContenedor); cont.innerHTML = '';
            const w = tipo === 'h' ? '12px' : '22px';
            const h = tipo === 'h' ? '22px' : '12px';

            mano.forEach(ficha => {
                const wrapper = document.createElement('div');
                wrapper.style.width = w; wrapper.style.height = h;
                wrapper.style.position = 'relative';

                const divFicha = document.createElement('div');
                divFicha.className = `ficha ${tipo === 'h' ? '' : 'horizontal'}`;
                divFicha.style.transform = 'scale(0.24)'; 
                divFicha.style.transformOrigin = 'top left';
                divFicha.style.position = 'absolute'; divFicha.style.top = '0'; divFicha.style.left = '0'; divFicha.style.pointerEvents = 'none'; 
                divFicha.innerHTML = `${generarHTMLMitad(ficha[0])}<div class="linea-divisoria"></div>${generarHTMLMitad(ficha[1])}`;
                
                wrapper.appendChild(divFicha); cont.appendChild(wrapper);
            });
        }

        function dibujarDorsos(idContenedor, cantidad, tipo) {
            const cont = document.getElementById(idContenedor); cont.innerHTML = '';
            for(let i=0; i<cantidad; i++) {
                const dorso = document.createElement('div'); dorso.className = `ficha-dorso ${tipo}`; cont.appendChild(dorso);
            }
        }

        function renderizarManos() {
            const miMano = document.getElementById('mi-mano'); miMano.innerHTML = ''; 
            jugadores[1].forEach((ficha, index) => {
                const divFicha = document.createElement('div'); divFicha.className = 'ficha';
                if (esperandoSeleccionPunta && index === indexSeleccionado) divFicha.classList.add('seleccionada');
                divFicha.innerHTML = `${generarHTMLMitad(ficha[0])}<div class="linea-divisoria"></div>${generarHTMLMitad(ficha[1])}`;
                divFicha.onclick = () => intentarJugada(ficha, 1, index);
                miMano.appendChild(divFicha);
            });

            if (juegoTerminado) {
                dibujarFichasReveladas('mano-j2', jugadores[2], 'v');
                dibujarFichasReveladas('mano-j3', jugadores[3], 'h');
                dibujarFichasReveladas('mano-j4', jugadores[4], 'v');
            } else {
                dibujarDorsos('mano-j2', jugadores[2].length, 'v');
                dibujarDorsos('mano-j3', jugadores[3].length, 'h');
                dibujarDorsos('mano-j4', jugadores[4].length, 'v');
            }
        }

        function resaltarTurnoActivo() {
            for(let i=1; i<=4; i++) {
                const wrap = document.getElementById(`pos-j${i}`);
                if (wrap) wrap.classList.remove('turno-activo');
            }
            if (!juegoTerminado && !esperandoSeleccionPunta) {
                const wrapAct = document.getElementById(`pos-j${turnoActual}`);
                if (wrapAct) wrapAct.classList.add('turno-activo');
            }
        }

        function aplicarGiro(joint, prevIsDouble, prevDir, newDir) {
            let offsetPar = prevIsDouble ? 41 : 20.5; let offsetPerp = 20.5;
            if (prevDir === 'R' && newDir === 'D') { joint.x -= offsetPerp; joint.y += offsetPar; }
            else if (prevDir === 'R' && newDir === 'U') { joint.x -= offsetPerp; joint.y -= offsetPar; }
            else if (prevDir === 'L' && newDir === 'D') { joint.x += offsetPerp; joint.y += offsetPar; }
            else if (prevDir === 'L' && newDir === 'U') { joint.x += offsetPerp; joint.y -= offsetPar; }
            else if (prevDir === 'D' && newDir === 'R') { joint.x += offsetPar; joint.y -= offsetPerp; }
            else if (prevDir === 'D' && newDir === 'L') { joint.x -= offsetPar; joint.y -= offsetPerp; }
            else if (prevDir === 'U' && newDir === 'R') { joint.x += offsetPar; joint.y += offsetPerp; }
            else if (prevDir === 'U' && newDir === 'L') { joint.x -= offsetPar; joint.y += offsetPerp; }
            joint.dir = newDir;
        }

        function drawFichaOrientada(ficha, cx, cy, dir, contenedor, zIndexLocal) {
            const esDoble = ficha[0] === ficha[1];
            let w = (dir === 'R' || dir === 'L') ? (esDoble ? 44 : 82) : (esDoble ? 82 : 44);
            let h = (dir === 'R' || dir === 'L') ? (esDoble ? 82 : 44) : (esDoble ? 44 : 82);
            
            if (dir === 'U' || dir === 'D') { if (esDoble) { w = 82; h = 44; } }
            
            let claseExtra = (dir === 'R' || dir === 'L') ? (esDoble ? 'vertical' : 'horizontal') : (esDoble ? 'horizontal' : 'vertical');
            
            const divFicha = document.createElement('div');
            divFicha.className = `ficha ficha-mesa ${claseExtra}`;
            divFicha.style.left = (cx - w/2) + 'px'; divFicha.style.top = (cy - h/2) + 'px'; divFicha.style.zIndex = zIndexLocal; 
            
            let parte1 = ficha[0], parte2 = ficha[1];
            if (dir === 'L' || dir === 'U') {
                parte1 = ficha[1];
                parte2 = ficha[0];
            }
            
            divFicha.innerHTML = `${generarHTMLMitad(parte1)}<div class="linea-divisoria"></div>${generarHTMLMitad(parte2)}`;
            contenedor.appendChild(divFicha);

            return { minX: cx - w/2, maxX: cx + w/2, minY: cy - h/2, maxY: cy + h/2 };
        }

        function simularFichaBounds(ficha, cx, cy, dir) {
            const esDoble = ficha[0] === ficha[1];
            let w = (dir === 'R' || dir === 'L') ? (esDoble ? 44 : 82) : (esDoble ? 82 : 44);
            let h = (dir === 'R' || dir === 'L') ? (esDoble ? 82 : 44) : (esDoble ? 44 : 82);
            if (dir === 'U' || dir === 'D') { if (esDoble) { w = 82; h = 44; } }
            return { minX: cx - w/2, maxX: cx + w/2, minY: cy - h/2, maxY: cy + h/2 };
        }

        function calcularCadenaBounds() {
            if (!fichaCentro) return null;
            let bounds = { minX: 0, maxX: 0, minY: 0, maxY: 0 };
            
            let iniciaNosotros = (jugadorSalida === 1 || jugadorSalida === 3);
            let esDoble = fichaCentro[0] === fichaCentro[1];
            let w = iniciaNosotros ? (esDoble ? 82 : 44) : (esDoble ? 44 : 82);
            let h = iniciaNosotros ? (esDoble ? 44 : 82) : (esDoble ? 82 : 44);

            bounds.minX = -w/2; bounds.maxX = w/2;
            bounds.minY = -h/2; bounds.maxY = h/2;

            function procesarRamaSim(rama, isRight) {
                let joint = isRight 
                    ? (iniciaNosotros ? { x: 0, y: h/2, dir: 'D' } : { x: w/2, y: 0, dir: 'R' })
                    : (iniciaNosotros ? { x: 0, y: -h/2, dir: 'U' } : { x: -w/2, y: 0, dir: 'L' });
                
                let prevIsDouble = esDoble;
                const secuenciaDerecha = ['R', 'D', 'L', 'D', 'R', 'U', 'L', 'U'];
                const secuenciaIzquierda = ['L', 'U', 'R', 'U', 'L', 'D', 'R', 'D'];
                const secuenciaVerticalDer = ['D', 'R', 'U', 'R', 'D', 'L', 'U', 'L'];
                const secuenciaVerticalIzq = ['U', 'L', 'D', 'L', 'U', 'R', 'D', 'R'];

                rama.forEach((f, idx) => {
                    let isD = f[0] === f[1];
                    let tramo = Math.floor(idx / 3);
                    let newDir = iniciaNosotros 
                        ? (isRight ? secuenciaVerticalDer[tramo % secuenciaVerticalDer.length] : secuenciaVerticalIzq[tramo % secuenciaVerticalIzq.length])
                        : (isRight ? secuenciaDerecha[tramo % secuenciaDerecha.length] : secuenciaIzquierda[tramo % secuenciaIzquierda.length]);

                    if (newDir !== joint.dir) aplicarGiro(joint, prevIsDouble, joint.dir, newDir);

                    let advance = isD ? 44 : 82;
                    let curCx = joint.x + (newDir === 'R' ? advance/2 : (newDir === 'L' ? -advance/2 : 0));
                    let curCy = joint.y + (newDir === 'D' ? advance/2 : (newDir === 'U' ? -advance/2 : 0));

                    joint.x += (newDir === 'R' ? advance : (newDir === 'L' ? -advance : 0));
                    joint.y += (newDir === 'D' ? advance : (newDir === 'U' ? -advance : 0));

                    let b = simularFichaBounds(f, curCx, curCy, newDir);
                    bounds.minX = Math.min(bounds.minX, b.minX);
                    bounds.maxX = Math.max(bounds.maxX, b.maxX);
                    bounds.minY = Math.min(bounds.minY, b.minY);
                    bounds.maxY = Math.max(bounds.maxY, b.maxY);
                    prevIsDouble = isD;
                });
            }

            procesarRamaSim(ramaDerecha, true);
            procesarRamaSim(ramaIzquierda, false);
            return bounds;
        }

        function renderizarRama(rama, joint, isRightBranch, contenedorZoom, zIndexG, iniciaNosotros) {
            let prevIsDouble = fichaCentro[0] === fichaCentro[1];
            const secuenciaDerecha = ['R', 'D', 'L', 'D', 'R', 'U', 'L', 'U'];
            const secuenciaIzquierda = ['L', 'U', 'R', 'U', 'L', 'D', 'R', 'D'];
            const secuenciaVerticalDer = ['D', 'R', 'U', 'R', 'D', 'L', 'U', 'L'];
            const secuenciaVerticalIzq = ['U', 'L', 'D', 'L', 'U', 'R', 'D', 'R'];

            rama.forEach((ficha, idx) => {
                const isDouble = ficha[0] === ficha[1]; 
                let tramo = Math.floor(idx / 3);
                let newDir = iniciaNosotros 
                    ? (isRightBranch ? secuenciaVerticalDer[tramo % secuenciaVerticalDer.length] : secuenciaVerticalIzq[tramo % secuenciaVerticalIzq.length])
                    : (isRightBranch ? secuenciaDerecha[tramo % secuenciaDerecha.length] : secuenciaIzquierda[tramo % secuenciaIzquierda.length]);

                if (newDir !== joint.dir) aplicarGiro(joint, prevIsDouble, joint.dir, newDir);

                let advance = isDouble ? 44 : 82; 
                let curCx = joint.x + (newDir === 'R' ? advance/2 : (newDir === 'L' ? -advance/2 : 0));
                let curCy = joint.y + (newDir === 'D' ? advance/2 : (newDir === 'U' ? -advance/2 : 0));

                joint.x += (newDir === 'R' ? advance : (newDir === 'L' ? -advance : 0));
                joint.y += (newDir === 'D' ? advance : (newDir === 'U' ? -advance : 0));

                drawFichaOrientada(ficha, curCx, curCy, newDir, contenedorZoom, zIndexG++);
                prevIsDouble = isDouble;
            });

            if (esperandoSeleccionPunta) {
                const marcador = document.createElement('div'); 
                marcador.className = 'marcador-punta';
                marcador.style.left = joint.x + 'px'; 
                marcador.style.top = joint.y + 'px';
                marcador.onclick = () => ejecutarEleccion(!isRightBranch);
                contenedorZoom.appendChild(marcador);
            }
        }

        /* --- MOTOR DE ENCUADRE DINÁMICO Y AUTO-ESCALA --- */
        function renderizarMesa() {
            const contenedorZoom = document.getElementById('zoom-container'); 
            contenedorZoom.innerHTML = '';
            if (!fichaCentro) return;

            const tapete = document.getElementById('mesa-tapete');
            const anchoTapete = tapete.clientWidth;
            const altoTapete = tapete.clientHeight;

            // Área segura para que las fichas nunca bajen hasta la mano del jugador
            // Reserva 88px en la parte inferior y 45px arriba para los avatares
            const areaSeguraW = anchoTapete - 90;
            const areaSeguraH = altoTapete - 130;
            const centroSeguroX = anchoTapete / 2;
            const centroSeguroY = (altoTapete - 40) / 2;

            // 1. Calcular caja de límites de la cadena completa (bounding box)
            const bounds = calcularCadenaBounds();
            const anchoCadena = Math.max(80, bounds.maxX - bounds.minX + 30);
            const altoCadena = Math.max(80, bounds.maxY - bounds.minY + 30);
            const centroCadenaX = (bounds.minX + bounds.maxX) / 2;
            const centroCadenaY = (bounds.minY + bounds.maxY) / 2;

            // 2. Escala óptima para que quepa en el área visible segura
            let escalaW = areaSeguraW / anchoCadena;
            let escalaH = areaSeguraH / altoCadena;
            let escalaOptima = Math.min(escalaW, escalaH, 0.90);
            escalaOptima = Math.max(0.38, Math.min(escalaOptima, 0.85));

            // 3. Trasladar la cámara para que el centro de la cadena coincida con el centro seguro
            const transX = centroSeguroX - (centroCadenaX * escalaOptima);
            const transY = centroSeguroY - (centroCadenaY * escalaOptima);

            contenedorZoom.style.transform = `translate(${transX}px, ${transY}px) scale(${escalaOptima})`;
            contenedorZoom.style.transformOrigin = '0 0';

            // 4. Dibujar la ficha centro en (0,0)
            let iniciaNosotros = (jugadorSalida === 1 || jugadorSalida === 3);
            let esDoble = fichaCentro[0] === fichaCentro[1];
            let w = iniciaNosotros ? (esDoble ? 82 : 44) : (esDoble ? 44 : 82);
            let h = iniciaNosotros ? (esDoble ? 44 : 82) : (esDoble ? 82 : 44);
            let claseExtraCentro = (w > h) ? 'horizontal' : 'vertical';

            const divFicha = document.createElement('div');
            divFicha.className = `ficha ficha-mesa ${claseExtraCentro}`;
            divFicha.style.left = (-w/2) + 'px'; 
            divFicha.style.top = (-h/2) + 'px'; 
            divFicha.style.zIndex = 10;
            divFicha.innerHTML = `${generarHTMLMitad(fichaCentro[0])}<div class="linea-divisoria"></div>${generarHTMLMitad(fichaCentro[1])}`;
            contenedorZoom.appendChild(divFicha);
            
            // 5. Renderizar ramas izquierda y derecha a partir del centro
            let jointDer = iniciaNosotros ? { x: 0, y: h/2, dir: 'D' } : { x: w/2, y: 0, dir: 'R' };
            let jointIzq = iniciaNosotros ? { x: 0, y: -h/2, dir: 'U' } : { x: -w/2, y: 0, dir: 'L' };

            renderizarRama(ramaDerecha, jointDer, true, contenedorZoom, 11, iniciaNosotros);
            renderizarRama(ramaIzquierda, jointIzq, false, contenedorZoom, 100, iniciaNosotros);
        }

        function agregarRondaHistorial(equipoGanador, puntos) {
            const colNosotros = document.getElementById('historial-nosotros');
            const colEllos = document.getElementById('historial-ellos');
            const item = document.createElement('div');
            item.innerText = `+${puntos}`;
            item.className = equipoGanador === 1 ? 'punto-anotado nos' : 'punto-anotado ellos';

            if (equipoGanador === 1) { colNosotros.appendChild(item); colNosotros.scrollTop = colNosotros.scrollHeight; } 
            else { colEllos.appendChild(item); colEllos.scrollTop = colEllos.scrollHeight; }
        }

        function mostrarModalVictoria(ganadorEquipo) {
            const modal = document.getElementById('modal-victoria');
            const texto = document.getElementById('equipo-ganador-texto');
            const titulo = document.getElementById('titulo-victoria-color');
            texto.innerText = ganadorEquipo === 1 ? 'Equipo Nosotros' : 'Equipo Ellos';
            texto.style.color = ganadorEquipo === 1 ? '#00bcd4' : '#ff1744';
            titulo.style.color = ganadorEquipo === 1 ? '#00bcd4' : '#ff1744';
            modal.classList.remove('oculto');
        }

        function reiniciarPartidaCompleta() {
            puntosNosotros = 0; puntosEllos = 0; ultimoGanador = null;
            document.getElementById('ptos-lat-nosotros').innerText = `0`; document.getElementById('ptos-lat-ellos').innerText = `0`;
            document.getElementById('historial-nosotros').innerHTML = ''; document.getElementById('historial-ellos').innerHTML = '';
            document.getElementById('modal-victoria').classList.add('oculto');
            iniciarManoConAnimacion();
        }

        function revisarPuntos() {
            document.getElementById('ptos-lat-nosotros').innerText = `${puntosNosotros}`; 
            document.getElementById('ptos-lat-ellos').innerText = `${puntosEllos}`;

            if (puntosNosotros >= metaPuntos || puntosEllos >= metaPuntos) {
                juegoTerminado = true;
                document.getElementById('btn-siguiente').style.display = 'none';
                document.getElementById('banner-ganador-mano').style.display = 'none';
                mostrarModalVictoria(puntosNosotros >= metaPuntos ? 1 : 2);
                return true;
            }
            return false;
        }

        function finalizarMano(ganador, porTranque = false, esCapicua = false) {
            juegoTerminado = true; limpiarBurbujas(); ocultarToast();
            
            let sumaPuntosMano = 0;
            for(let i = 1; i <= 4; i++) sumaPuntosMano += sumarMano(jugadores[i]);

            let equipoGanador = 0; 
            let jGanadorFinal = ganador;
            let tipoVictoria = "¡DOMINÓ!";
            
            if (porTranque) {
                let jTranco = ultimoJugadorEnJugar; let jSigue = (ultimoJugadorEnJugar % 4) + 1;
                let ptsTranco = sumarMano(jugadores[jTranco]); let ptsSigue = sumarMano(jugadores[jSigue]);

                jGanadorFinal = (ptsTranco <= ptsSigue) ? jTranco : jSigue;
                equipoGanador = (jGanadorFinal === 1 || jGanadorFinal === 3) ? 1 : 2;
                ultimoGanador = jGanadorFinal;
                tipoVictoria = "¡TRANQUE! 🔒";
                sacudirMesa();
            } else {
                equipoGanador = (ganador === 1 || ganador === 3) ? 1 : 2;
                ultimoGanador = ganador;
                
                if (esCapicua) { 
                    sumaPuntosMano += 30; 
                    tipoVictoria = "¡CAPICÚA! 🌟";
                    sacudirMesa();
                }
            }

            if (equipoGanador === 1) puntosNosotros += sumaPuntosMano; else puntosEllos += sumaPuntosMano;
            agregarRondaHistorial(equipoGanador, sumaPuntosMano);
            
            for (let i = 1; i <= 4; i++) {
                const wrap = document.getElementById(`pos-j${i}`);
                if (wrap) wrap.classList.remove('avatar-ganador-ronda');
            }
            const ganadorWrap = document.getElementById(`pos-j${jGanadorFinal}`);
            if (ganadorWrap) ganadorWrap.classList.add('avatar-ganador-ronda');

            const banner = document.getElementById('banner-ganador-mano');
            const txtTitulo = document.getElementById('texto-ganador-mano');
            const txtPtos = document.getElementById('texto-puntos-mano');
            txtTitulo.innerHTML = `🏆 ${tipoVictoria} Ganó ${nombresJugadores[jGanadorFinal]}`;
            txtPtos.innerText = `+${sumaPuntosMano} Puntos para Equipo ${equipoGanador === 1 ? 'Nosotros' : 'Ellos'}`;
            banner.style.display = 'flex';

            document.getElementById('btn-siguiente').style.display = 'block';

            let termino = revisarPuntos();
            if (termino) {
                document.getElementById('btn-siguiente').style.display = 'none';
                banner.style.display = 'none';
            }
            
            renderizarManos(); 
            renderizarMesa();
        }

        function avanzarTurno() {
            if (juegoTerminado) return;
            turnoActual = turnoActual === 4 ? 1 : turnoActual + 1;
            if (!fichaCentro) { iniciarTurnoNormal(); return; }

            let puedeJugar = jugadores[turnoActual].some(ficha => ficha[0] === extremoIzquierdo || ficha[1] === extremoIzquierdo || ficha[0] === extremoDerecho || ficha[1] === extremoDerecho);

            if (!puedeJugar) {
                pasesConsecutivos++; resaltarTurnoActivo();
                if (pasesConsecutivos >= 4) { finalizarMano(0, true); return; }
                
                let txtPaso = frasesPaso[Math.floor(Math.random() * frasesPaso.length)];

                if (esPrimerTurnoDespuesDeSalida) {
                    mostrarBurbuja(turnoActual, txtPaso, "paso", false, true);
                    mostrarBurbuja(jugadorSalida, "+30 Salida 🔥", "ganador", false, false);
                    let equipoSalida = (jugadorSalida === 1 || jugadorSalida === 3) ? 1 : 2;
                    if (equipoSalida === 1) puntosNosotros += 30; else puntosEllos += 30;
                    agregarRondaHistorial(equipoSalida, 30);
                    mostrarToast("¡30 a la salida!");
                    if(revisarPuntos()) return;
                } else {
                    mostrarBurbuja(turnoActual, txtPaso, "paso", false, true);
                }
                
                esPrimerTurnoDespuesDeSalida = false;
                setTimeout(avanzarTurno, 1300);
            } else {
                if (pasesConsecutivos === 3 && fichaCentro) {
                    mostrarBurbuja(turnoActual, "¡Paso en banda! +30", "ganador", true);
                    let equipo = (turnoActual === 1 || turnoActual === 3) ? 1 : 2;
                    if (equipo === 1) puntosNosotros += 30; else puntosEllos += 30;
                    agregarRondaHistorial(equipo, 30);
                    let termino = revisarPuntos();
                    pasesConsecutivos = 0;
                    if(termino) return; 
                }
                pasesConsecutivos = 0; 
                esPrimerTurnoDespuesDeSalida = false; 
                iniciarTurnoNormal();
            }
        }

        function iniciarTurnoNormal() {
            resaltarTurnoActivo();
            if (turnoActual !== 1) { 
                let txtPensar = frasesPensando[Math.floor(Math.random() * frasesPensando.length)];
                mostrarBurbuja(turnoActual, txtPensar, "pensando"); 
                setTimeout(turnoIA, 1200); 
            }
            else if (salidaObligatoria && !fichaCentro) { mostrarToast("Debes salir con el Doble 6"); }
            else { mostrarToast("¡Tu turno!"); }
        }

        function intentarJugada(ficha, idJugador, index) {
            if (juegoTerminado || turnoActual !== idJugador) return; 
            if (salidaObligatoria && !fichaCentro) { if (ficha[0] !== 6 || ficha[1] !== 6) { if (idJugador === 1) mostrarToast("Debes salir con el doble 6."); return; } }
            if (esperandoSeleccionPunta) { esperandoSeleccionPunta = false; fichaSeleccionada = null; indexSeleccionado = null; renderizarManos(); renderizarMesa(); iniciarTurnoNormal(); }

            let [a, b] = ficha;
            let puedeIzq = (!fichaCentro) ? true : (a === extremoIzquierdo || b === extremoIzquierdo);
            let puedeDer = (!fichaCentro) ? true : (a === extremoDerecho || b === extremoDerecho);

            if (!puedeIzq && !puedeDer) { mostrarToast("Ficha no válida"); return; } 

            let esCapicua = false;
            if (jugadores[idJugador].length === 1 && fichaCentro && puedeIzq && puedeDer && extremoIzquierdo !== extremoDerecho) esCapicua = true;

            if (idJugador === 1 && fichaCentro && puedeIzq && puedeDer && extremoIzquierdo !== extremoDerecho) {
                esperandoSeleccionPunta = true; fichaSeleccionada = ficha; indexSeleccionado = index;
                fichaSeleccionada.esCapicua = esCapicua;
                renderizarManos(); renderizarMesa(); 
                mostrarToast("Toca el círculo donde colocarla");
                return; 
            }

            let ponerIzquierda = false;
            if (fichaCentro && puedeIzq && puedeDer) ponerIzquierda = Math.random() > 0.5; 
            else if (puedeIzq) ponerIzquierda = true;

            procesarJugadaFinal(ficha, idJugador, index, ponerIzquierda, esCapicua);
        }

        function ejecutarEleccion(esIzquierda) {
            esperandoSeleccionPunta = false; ocultarToast();
            let esCapicua = fichaSeleccionada.esCapicua || false;
            procesarJugadaFinal(fichaSeleccionada, 1, indexSeleccionado, esIzquierda, esCapicua);
            fichaSeleccionada = null; indexSeleccionado = null;
        }

        function procesarJugadaFinal(ficha, idJugador, index, colocarIzquierda, esCapicua = false) {
            let [a, b] = ficha; 
            
            if (!fichaCentro) { 
                let max = Math.max(a, b);
                let min = Math.min(a, b);
                
                if (idJugador === 1 || idJugador === 2) {
                    fichaCentro = [min, max];
                    extremoIzquierdo = min;
                    extremoDerecho = max;
                } else {
                    fichaCentro = [max, min];
                    extremoIzquierdo = max;
                    extremoDerecho = min;
                }
                salidaObligatoria = false; 
                esPrimerTurnoDespuesDeSalida = true; 
            } else if (colocarIzquierda) {
                if (a === extremoIzquierdo) {
                    ramaIzquierda.push([a, b]);
                    extremoIzquierdo = b;
                } else {
                    ramaIzquierda.push([b, a]);
                    extremoIzquierdo = a;
                }
            } else {
                if (a === extremoDerecho) {
                    ramaDerecha.push([a, b]);
                    extremoDerecho = b;
                } else {
                    ramaDerecha.push([b, a]);
                    extremoDerecho = a;
                }
            }
            jugadores[idJugador].splice(index, 1); 
            ultimoJugadorEnJugar = idJugador; 
            
            if (jugadores[idJugador].length === 0) { finalizarMano(idJugador, false, esCapicua); return; }
            limpiarBurbujas(); ocultarToast(); renderizarManos(); renderizarMesa(); avanzarTurno();
        }

        function turnoIA() {
            if (juegoTerminado) return;
            let manoIA = jugadores[turnoActual];
            
            if (salidaObligatoria && !fichaCentro) { 
                let index66 = manoIA.findIndex(f => f[0] === 6 && f[1] === 6); 
                if (index66 !== -1) { intentarJugada(manoIA[index66], turnoActual, index66); return; } 
            }
            
            let validas = [];
            for (let i = 0; i < manoIA.length; i++) {
                let ficha = manoIA[i]; let [a, b] = ficha;
                if (!fichaCentro || a === extremoDerecho || b === extremoDerecho || a === extremoIzquierdo || b === extremoIzquierdo) { 
                    let peso = (a === b) ? 10 : 0; 
                    peso += manoIA.filter(f => f[0]===a || f[1]===a).length;
                    peso += manoIA.filter(f => f[0]===b || f[1]===b).length;
                    validas.push({ficha, index: i, peso}); 
                }
            }
            
            if (validas.length > 0) {
                validas.sort((a,b) => b.peso - a.peso);
                intentarJugada(validas[0].ficha, turnoActual, validas[0].index);
            }
        }

        function crearAnimacionFichas() {
            const cont = document.getElementById('fichas-animadas'); cont.innerHTML = '';
            for(let i=0; i<28; i++) {
                const f = document.createElement('div'); f.className = 'ficha-revuelta';
                f.style.setProperty('--rx', (Math.random() * 260 - 130)); f.style.setProperty('--ry', (Math.random() * 260 - 130));
                f.style.setProperty('--rrot', (Math.random() * 360)); f.style.setProperty('--rx2', (Math.random() * 260 - 130));
                f.style.setProperty('--ry2', (Math.random() * 260 - 130)); f.style.setProperty('--rrot2', (Math.random() * 360));
                cont.appendChild(f);
            }
        }

        function iniciarManoConAnimacion() {
            document.getElementById('btn-siguiente').style.display = 'none';
            document.getElementById('banner-ganador-mano').style.display = 'none';
            for (let i = 1; i <= 4; i++) {
                const wrap = document.getElementById(`pos-j${i}`);
                if (wrap) wrap.classList.remove('avatar-ganador-ronda');
            }

            limpiarBurbujas(); ocultarToast();
            
            document.getElementById('mi-mano').innerHTML = ''; document.getElementById('mano-j2').innerHTML = '';
            document.getElementById('mano-j3').innerHTML = ''; document.getElementById('mano-j4').innerHTML = '';
            document.getElementById('zoom-container').innerHTML = '';

            const overlay = document.getElementById('pantalla-barajar'); overlay.classList.remove('oculto');
            crearAnimacionFichas();
            setTimeout(() => { overlay.classList.add('oculto'); ejecutarLogicaReparto(); }, 2000);
        }

        function ejecutarLogicaReparto() {
            mazo = [];
            for (let i = 0; i <= 6; i++) for (let j = i; j <= 6; j++) mazo.push([i, j]);
            for (let i = mazo.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [mazo[i], mazo[j]] = [mazo[j], mazo[i]]; }
            let pos = 0;
            for (let i = 1; i <= 4; i++) { jugadores[i] = mazo.slice(pos, pos + 7); pos += 7; }

            fichaCentro = null; ramaIzquierda = []; ramaDerecha = [];
            extremoIzquierdo = null; extremoDerecho = null;
            juegoTerminado = false; pasesConsecutivos = 0; esperandoSeleccionPunta = false; ultimoJugadorEnJugar = null;
            esPrimerTurnoDespuesDeSalida = false;

            let primerJuego = (puntosNosotros === 0 && puntosEllos === 0);
            if (primerJuego) {
                for (let i = 1; i <= 4; i++) { if (jugadores[i].some(f => f[0] === 6 && f[1] === 6)) { turnoActual = i; salidaObligatoria = true; break; } }
            } else {
                turnoActual = ultimoGanador || 1; salidaObligatoria = false;
            }
            
            jugadorSalida = turnoActual; 

            renderizarManos(); renderizarMesa(); iniciarTurnoNormal();
        }

        window.addEventListener('resize', () => {
            renderizarManos();
            renderizarMesa();
        });

        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                renderizarManos();
                renderizarMesa();
            }, 200);
        });

        iniciarManoConAnimacion();
    </script>
